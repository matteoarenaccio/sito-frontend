<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="SUI" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    
    <title>Sito Prova</title>
<body class="bg">
    <nav class="navbar navbar-expand-lg bg-transparent">
        <div class="container-fluid bs-dark">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavbar"
                aria-controls="menuNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <a class="navbar-brand fw-bold text-dark active" href="#">[Logo sito]
            </a>
            <div class="collapse navbar-collapse" id="menuNavbar">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a href="index.html" class="nav-link text-white active"> Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white">|</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link text-white">Servizi</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white">|</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link text-white">Contattaci</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>


    <div class="container">
        <div class="row justify-content-center">
            <div class="col-4 mt-2" align="center">


                <form id="registerForm" class="glass-form p-4 rounded d-inline-block">

                    <div>
                        <p class="fw-light fw-bold">REGISTRATI</p>
                    </div>

                    <hr class="my-2 border-2">


                    <div class="mt-2">
                        <label for="nome">Nome</label>
                    </div>

                    <div class=" container mt-2">
                        <input type="text" id="nome" name="nome" class="form-control" placeholder="Nome" required>
                    </div>


                    <div class="mt-2">
                        <label for="cognome">Cognome</label>
                    </div>

                    <div class=" container mt-2">
                        <input type="text" name="cognome" id="cognome" class="form-control" placeholder="Cognome" required>
                    </div>

                    <div class="mt-2">
                        <label class="form-label" for="email"> Email </label>
                    </div>

                    <div id="messaggioErrore" class="text-danger mb-1"></div>

                    <div class="container">
                        <input type="text" id="email" name="email" class="form-control"
                            placeholder="example@gmail.com" required />
                    </div>

                    <div class="mt-2">
                        <label class="form-label" for="password"> Password </label>
                    </div>

                    <div id="messaggioErrorePass" class="text-danger mb-1"></div>

                    <div class=" container password-wrapper">
                        <input type="password" id="password" name="password" class="form-control" placeholder="Password" required />
                        <i class="fa-solid fa-eye" id="toggleIcon" onclick="togglePassword()"></i>
                    </div>
                    
                    <div align="left" class="container fontPass mt-1">
                            <i><li class="liPass" >8 Caratteri</li>
                            <li class="liPass">1 Carattere speciale: ! , . ; $</li>
                            <li class="liPass">1 Carattere Maiuscolo</li>
                            <li class="liPass">1 Numero</li></i>        
                    </div>

                    <div class="mt-3">
                        <button class="btn btn-light" type="submit">Registrati</button>
                    </div>

                    <hr class="my-3 border-2">

                    <div>
                        <label class="form-label mt-2"><i>Hai gia' un account? </i><a class="text-dark"
                                href="login.html">Accedi</a></label>
                    </div>

                </form>
            </div>
        </div>
    </div>
    <script src="js/register.js"></script>
</body>
</html>

<!doctype html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Sito Prova</title>
</head>

<body class="bg">
<nav class="navbar navbar-expand-lg bg-transparent">
        <div class="container-fluid bs-dark">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavbar" aria-controls="menuNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <a class="navbar-brand fw-bold text-white active" href="#">
                <img class="rounded img-fluid" src="img/logo.jpg" alt="logo-sito" width="40" height="40">
            </a>
            <div class="collapse navbar-collapse" id="menuNavbar">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a href="index.html" class="nav-link text-white active"> Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white">|</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white">Servizi</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white">|</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white">Contattaci</a>
                    </li>
                  
                </ul>
            </div>
        </div>
    </nav>


    <div class="container">
        <div class="row justify-content-center">
            <div class="col-4 mt-5" align="center">

                
                <form id="loginForm" class="glass-form p-4 rounded d-inline-block">

                    <div>
                        <p class="fw-light fw-bold">ACCEDI</p>
                    </div>

                    <hr class="my-2 border-2">

                    <div class="mt-2">
                        <label class="form-label" for="nome"> Email </label>
                    </div>

                    <div>
                        <input type="text" id="email" name="email" class="form-control" placeholder="example@gmail.com" required />
                    </div>

                    <div class="mt-2">
                        <label class="form-label" for="password"> Password </label>
                    </div>

                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" class="form-control" placeholder="Password" required />
                        <i class="fa-solid fa-eye" id="toggleIcon" onclick="togglePassword()"></i>
                    </div>

                    <div class="mt-3">
                        <button class="btn btn-light" type="submit">Login</button>
                    </div>

                    <div id="messErroreLogin" class="text-danger"></div>

                    <hr class="my-3 border-2">

                     <div>
                        <label class="form-label mt-2"><i>Non hai un account? </i><a class="text-dark" href="register.html">Registrati</a></label>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>

</html>
